<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>歩行器の書き込み</title>
  <script src="flasher-completion.js"></script>
  <script type="module" src="https://unpkg.com/esp-web-tools@10.1.1/dist/web/install-button.js?module"></script>
  <style>body{font:1rem/1.7 system-ui,sans-serif;max-width:42rem;margin:3rem auto;padding:0 1rem;color:#203044}button{font:inherit;background:#175ab1;color:white;border:0;border-radius:.5rem;padding:.6rem 1rem;cursor:pointer}.serial-button{margin-top:1rem;background:#435369}</style>
</head>
<body><main>
  <h1>歩行器の書き込み</h1>
  <p>本体プログラム <code>walking-support-transfer-v39-walk4</code></p>
  <p>書き込み後は、機体の測定画面で「歩行を開始（±8°・30秒）」を押してください。</p>
  <p>測定後は機体の画面で「RWLOGを取得・再開」を押すとログを保存できます。</p>
  <p>機体を停止し、バッテリーを外してUSBだけでPCにつないでください。PC版のChromeまたはEdgeで操作できます。</p>
  <esp-web-install-button manifest="manifest.json">
    <button slot="activate">歩行プログラムを書き込む</button>
    <span slot="unsupported">PC版ChromeまたはEdgeで開いてください。</span>
  </esp-web-install-button>
</main><script src="soft-boot.js" defer></script></body></html>
