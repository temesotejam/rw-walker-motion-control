[env:atoms3cam]
extra_scripts =
  pre:tools/patch_bmi270_timing.py
  pre:tools/patch_madgwick_hot.py
platform = espressif32@6.7.0
board = m5stack-atoms3
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.boot = qio
board_build.boot_freq = 80m
board_build.flash_freq = 80m
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

; Replace the board's Core 1 event-task default without duplicate definitions.
build_unflags = -DARDUINO_EVENT_RUNNING_CORE=1

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_EVENT_RUNNING_CORE=0
  -Wl,--wrap=xTaskCreatePinnedToCore

monitor_speed = 115200
monitor_filters = time
upload_speed = 115200

lib_deps =
  m5stack/M5Unified @ 0.2.18
  m5stack/M5GFX @ 0.2.30
  adafruit/Adafruit AHRS @ 2.4.0

; Explicitly select the angle-based early-input experiment. The default
; environment remains the ordinary firmware, without either trial flag.
[env:atoms3cam-angle-early]
extends = env:atoms3cam
build_flags =
  ${env:atoms3cam.build_flags}
  -DFOOT_EARLY_TRIAL=1
  -DANGLE_EARLY_TRIAL=1

[env:atoms3cam-angle-smooth]
extends = env:atoms3cam-angle-early
build_flags =
  ${env:atoms3cam-angle-early.build_flags}
  -DWALK_SMOOTH_TRIAL=1

[env:atoms3cam-symmetric-rescue]
extends = env:atoms3cam-angle-smooth
build_flags =
  ${env:atoms3cam-angle-smooth.build_flags}
  -DSYMMETRIC_RESCUE_TRIAL=1

[env:atoms3cam-early-rescue]
extends = env:atoms3cam-symmetric-rescue
build_flags =
  ${env:atoms3cam-symmetric-rescue.build_flags}
  -DEARLY_RESCUE_TRIAL=1

[env:atoms3cam-balance-trim]
extends = env:atoms3cam-early-rescue
build_flags =
  ${env:atoms3cam-early-rescue.build_flags}
  -DSWAY_BALANCE_TRIAL=1

[env:atoms3cam-approach-rescue]
extends = env:atoms3cam-balance-trim
build_flags =
  ${env:atoms3cam-balance-trim.build_flags}
  -DAPPROACH_RESCUE_TRIAL=1

[env:atoms3cam-fast-crossing]
extends = env:atoms3cam-approach-rescue
build_flags =
  ${env:atoms3cam-approach-rescue.build_flags}
  -DFAST_CROSSING_TRIAL=1

; Comparison run: observe the fast-crossing candidate without applying it.
[env:atoms3cam-fast-crossing-shadow]
extends = env:atoms3cam-approach-rescue
build_flags =
  ${env:atoms3cam-approach-rescue.build_flags}
  -DFAST_CROSSING_SHADOW=1

; Camera-task geometry/prediction diagnostics only. Motor policy inherits v6.
[env:atoms3cam-cad-support-shadow]
extends = env:atoms3cam-balance-trim
build_flags =
  ${env:atoms3cam-balance-trim.build_flags}
  -DCAD_SUPPORT_SHADOW=1

; Delayed-foot prediction and a bounded relocation of an ordinary drive.
[env:atoms3cam-foot-support-assist]
extends = env:atoms3cam-balance-trim
build_flags =
  ${env:atoms3cam-balance-trim.build_flags}
  -DFOOT_SUPPORT_ASSIST=1

; v12 complements repeated trajectories with confirmed local returning motion.
[env:atoms3cam-foot-support-local]
extends = env:atoms3cam-foot-support-assist
build_flags =
  ${env:atoms3cam-foot-support-assist.build_flags}
  -DFOOT_SUPPORT_LOCAL=1

; v13 first-reversal evidence and bounded foot-amount width addition.
[env:atoms3cam-foot-support-transfer]
extends = env:atoms3cam-foot-support-local
build_flags =
  ${env:atoms3cam-foot-support-local.build_flags}
  -DFOOT_SUPPORT_TRANSFER=1

; v14 selects every post-bootstrap width by energy deficit and response model.
[env:atoms3cam-foot-support-energy]
extends = env:atoms3cam-foot-support-transfer
build_flags =
  ${env:atoms3cam-foot-support-transfer.build_flags}
  -DFOOT_SUPPORT_ENERGY=1

; v15 moves the complete main energy budget earlier; no generic 15ms cap.
[env:atoms3cam-early-energy-main]
extends = env:atoms3cam-foot-support-energy
build_flags =
  ${env:atoms3cam-foot-support-energy.build_flags}
  -DEARLY_ENERGY_MAIN=1

; v16 fixes stale-loop pulse expiry and audits realized command duration.
[env:atoms3cam-energy-pulse-lifecycle]
extends = env:atoms3cam-early-energy-main
build_flags =
  ${env:atoms3cam-early-energy-main.build_flags}
  -DPULSE_LIFECYCLE_FIX=1

; Same v16 motor policy; allow a slow AP to finish the runtime HTML response.
[env:atoms3cam-energy-pulse-lifecycle-webfix]
extends = env:atoms3cam-energy-pulse-lifecycle
build_flags =
  ${env:atoms3cam-energy-pulse-lifecycle.build_flags}
  -DWEB_PAGE_TRANSPORT_FIX=1

; Reserve internal Wi-Fi RAM by moving the passive 192-row archive to PSRAM.
[env:atoms3cam-energy-pulse-lifecycle-webfix2]
extends = env:atoms3cam-energy-pulse-lifecycle-webfix
build_flags =
  ${env:atoms3cam-energy-pulse-lifecycle-webfix.build_flags}
  -DWALKING_AUDIT_PSRAM=1

; v17 adds causal arrival-energy feedback and a foot-gated return-work budget.
[env:atoms3cam-return-energy]
extends = env:atoms3cam-energy-pulse-lifecycle-webfix2
build_flags =
  ${env:atoms3cam-energy-pulse-lifecycle-webfix2.build_flags}
  -DWALKING_RETURN_ENERGY=1

; v18 separates return aid from the ordinary ZERO opportunity within one budget.
[env:atoms3cam-energy-transfer]
extends = env:atoms3cam-return-energy
build_flags =
  ${env:atoms3cam-return-energy.build_flags}
  -DWALKING_TRANSFER_V18=1

; v19 admits early energy proposals within model support and guards fore-aft drift.
[env:atoms3cam-energy-admission]
extends = env:atoms3cam-energy-transfer
build_flags =
  ${env:atoms3cam-energy-transfer.build_flags}
  -DWALKING_ADMISSION_V19=1

; v20 changes the foot-recognition pipeline; retain v19 walking energy policy.
[env:atoms3cam-foot-fast]
extends = env:atoms3cam-energy-admission
build_flags =
  ${env:atoms3cam-energy-admission.build_flags}
  -DFOOT_LOW_LATENCY_V20=1

; Download retry/UI diagnostics only; keep the v20 camera and v19 control.
[env:atoms3cam-foot-fast-downloadfix]
extends = env:atoms3cam-foot-fast
build_flags =
  ${env:atoms3cam-foot-fast.build_flags}
  -DEXPORT_RETRY_FIX=1

; Cooperative metadata serialization and reboot-aware export diagnostics.
[env:atoms3cam-foot-fast-downloadfix2]
extends = env:atoms3cam-foot-fast-downloadfix
build_flags =
  ${env:atoms3cam-foot-fast-downloadfix.build_flags}
  -DEXPORT_COOPERATIVE_FIX=1

; v21 publishes complete QVGA Y8 DMA frames before the next VSYNC.
[env:atoms3cam-foot-frame-ready]
extends = env:atoms3cam-foot-fast-downloadfix2
extra_scripts =
  ${env:atoms3cam.extra_scripts}
  pre:tools/check_camera_hal_abi.py
build_flags =
  ${env:atoms3cam-foot-fast-downloadfix2.build_flags}
  -DCAMERA_FRAME_READY_V21=1

; Shorter GC0308 line blanking and exact rolling contrast reuse.
[env:atoms3cam-foot-speed]
extends = env:atoms3cam-foot-frame-ready
build_flags =
  ${env:atoms3cam-foot-frame-ready.build_flags}
  -DFOOT_SPEED_V22=1

[env:atoms3cam-foot-speed-fix1]
extends = env:atoms3cam-foot-speed
build_flags =
  ${env:atoms3cam-foot-speed.build_flags}
  -DFOOT_SPEED_FIX1=1

; Integer divider7 capture clock, same HB128/AEC and complete marker search.
[env:atoms3cam-foot-capture]
extends = env:atoms3cam-foot-speed-fix1
build_flags =
  ${env:atoms3cam-foot-speed-fix1.build_flags}
  -DFOOT_CAPTURE_V23=1

; Idle receipt timing audit only; the original v22-fix1 camera/detector path.
[env:atoms3cam-foot-speed-receipt]
extends = env:atoms3cam-foot-speed-fix1
build_flags =
  ${env:atoms3cam-foot-speed-fix1.build_flags}
  -DFOOT_RECEIPT_AUDIT=1

; Prepare upper marker image features while the remaining DMA frame arrives.
[env:atoms3cam-foot-overlap]
extends = env:atoms3cam-foot-capture
build_flags =
  ${env:atoms3cam-foot-capture.build_flags}
  -DFOOT_ROW_OVERLAP_V24=1

; Sensor geometry/timing bench only: no walker controller, motor code or Web.
[env:atoms3cam-camera-skip-bench]
extends = env:atoms3cam-foot-capture
extra_scripts = pre:tools/check_camera_hal_abi.py
lib_deps =
build_src_filter = -<*> +<camera_skip_bench.cpp> +<camera_frame_ready_hal.c>
build_flags =
  ${env:atoms3cam-foot-capture.build_flags}
  -DCAMERA_GEOMETRY_PROBE_V25=1

; Native CIS row skipping, calibrated logical rows preserved from raw236.
[env:atoms3cam-foot-native]
extends = env:atoms3cam-foot-overlap
build_flags =
  ${env:atoms3cam-foot-overlap.build_flags}
  -DFOOT_NATIVE_SKIP_V25=1
  -DCAMERA_NATIVE_HB=96

; Incremental lower-marker features while native sensor rows are arriving.
[env:atoms3cam-foot-native-stream]
extends = env:atoms3cam-foot-native
build_flags =
  ${env:atoms3cam-foot-native.build_flags}
  -DFOOT_NATIVE_STREAM_V26=1

; Export fixes retain v26 capture and v19 energy policy.
[env:atoms3cam-foot-export-webfix]
extends = env:atoms3cam-foot-native-stream
build_flags =
  ${env:atoms3cam-foot-native-stream.build_flags}
  -DFOOT_EXPORT_WEBFIX=1

; Same sensor/search geometry, fewer repeated copies and unused HAL offers.
[env:atoms3cam-foot-copy-delta]
extends = env:atoms3cam-foot-export-webfix
build_flags =
  ${env:atoms3cam-foot-export-webfix.build_flags}
  -DFOOT_COPY_DELTA_V27=1

; Skip island scans only when the exact maximum proves no valid peak exists.
[env:atoms3cam-foot-template-prune]
extends = env:atoms3cam-foot-copy-delta
build_flags =
  ${env:atoms3cam-foot-copy-delta.build_flags}
  -DFOOT_TEMPLATE_PRUNE_V28=1

; Retain delta copies/pruning, restore continuous speculative preparation.
[env:atoms3cam-foot-overlap-always]
extends = env:atoms3cam-foot-template-prune
build_flags =
  ${env:atoms3cam-foot-template-prune.build_flags}
  -DFOOT_OVERLAP_ALWAYS_V29=1

; Keep rejected-frame counters without blocking console output on receive path.
[env:atoms3cam-foot-receive-diag]
extends = env:atoms3cam-foot-overlap-always
build_flags =
  ${env:atoms3cam-foot-overlap-always.build_flags}
  -DFOOT_RECEIVE_DIAG_V30=1

; Bench comparison: HAL core1 at priority3, below IMU6/control4; tracker stays core0.
[env:atoms3cam-foot-receive-core1]
extends = env:atoms3cam-foot-receive-diag
build_flags =
  ${env:atoms3cam-foot-receive-diag.build_flags}
  -DFOOT_RECEIVE_CORE1_V31=1

; Aggregate actual receipt delays without repeated full status polling.
[env:atoms3cam-foot-histogram]
extends = env:atoms3cam-foot-receive-diag
build_flags =
  ${env:atoms3cam-foot-receive-diag.build_flags}
  -DFOOT_HISTOGRAM_V32=1

; Same native geometry/readback/recognizer; shorter horizontal blank comparison.
[env:atoms3cam-foot-hblank80]
extends = env:atoms3cam-foot-histogram
build_flags =
  ${env:atoms3cam-foot-histogram.build_flags}
  -DFOOT_NATIVE_HB80_V33=1

; Report-guided comparison: HB96 retained; faster observer with full log capacity.
[env:atoms3cam-foot-worker26]
extends = env:atoms3cam-foot-histogram
build_flags =
  ${env:atoms3cam-foot-histogram.build_flags}
  -DFOOT_WORKER26_V34=1

; Compact live display; full status remains the default diagnostic endpoint.
[env:atoms3cam-foot-live-status]
extends = env:atoms3cam-foot-worker26
build_flags =
  ${env:atoms3cam-foot-worker26.build_flags}
  -DFOOT_LIVE_STATUS_V35=1
