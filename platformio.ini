[env:atoms3cam]
extra_scripts =
  pre:tools/patch_bmi270_timing.py
  pre:tools/patch_madgwick_hot.py
platform = espressif32@6.7.0
board = m5stack-atoms3
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.boot = qio
board_build.boot_freq = 80m
board_build.flash_freq = 80m
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

; Replace the board's Core 1 event-task default without duplicate definitions.
build_unflags = -DARDUINO_EVENT_RUNNING_CORE=1

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_EVENT_RUNNING_CORE=0
  -Wl,--wrap=xTaskCreatePinnedToCore

monitor_speed = 115200
monitor_filters = time
upload_speed = 115200

lib_deps =
  m5stack/M5Unified @ 0.2.18
  m5stack/M5GFX @ 0.2.30
  adafruit/Adafruit AHRS @ 2.4.0

; Explicitly select the angle-based early-input experiment. The default
; environment remains the ordinary firmware, without either trial flag.
[env:atoms3cam-angle-early]
extends = env:atoms3cam
build_flags =
  ${env:atoms3cam.build_flags}
  -DFOOT_EARLY_TRIAL=1
  -DANGLE_EARLY_TRIAL=1

[env:atoms3cam-angle-smooth]
extends = env:atoms3cam-angle-early
build_flags =
  ${env:atoms3cam-angle-early.build_flags}
  -DWALK_SMOOTH_TRIAL=1

[env:atoms3cam-symmetric-rescue]
extends = env:atoms3cam-angle-smooth
build_flags =
  ${env:atoms3cam-angle-smooth.build_flags}
  -DSYMMETRIC_RESCUE_TRIAL=1

[env:atoms3cam-early-rescue]
extends = env:atoms3cam-symmetric-rescue
build_flags =
  ${env:atoms3cam-symmetric-rescue.build_flags}
  -DEARLY_RESCUE_TRIAL=1

[env:atoms3cam-balance-trim]
extends = env:atoms3cam-early-rescue
build_flags =
  ${env:atoms3cam-early-rescue.build_flags}
  -DSWAY_BALANCE_TRIAL=1

[env:atoms3cam-approach-rescue]
extends = env:atoms3cam-balance-trim
build_flags =
  ${env:atoms3cam-balance-trim.build_flags}
  -DAPPROACH_RESCUE_TRIAL=1

[env:atoms3cam-fast-crossing]
extends = env:atoms3cam-approach-rescue
build_flags =
  ${env:atoms3cam-approach-rescue.build_flags}
  -DFAST_CROSSING_TRIAL=1

; Comparison run: observe the fast-crossing candidate without applying it.
[env:atoms3cam-fast-crossing-shadow]
extends = env:atoms3cam-approach-rescue
build_flags =
  ${env:atoms3cam-approach-rescue.build_flags}
  -DFAST_CROSSING_SHADOW=1

; Camera-task geometry/prediction diagnostics only. Motor policy inherits v6.
[env:atoms3cam-cad-support-shadow]
extends = env:atoms3cam-balance-trim
build_flags =
  ${env:atoms3cam-balance-trim.build_flags}
  -DCAD_SUPPORT_SHADOW=1

; Delayed-foot prediction and a bounded relocation of an ordinary drive.
[env:atoms3cam-foot-support-assist]
extends = env:atoms3cam-balance-trim
build_flags =
  ${env:atoms3cam-balance-trim.build_flags}
  -DFOOT_SUPPORT_ASSIST=1

; v12 complements repeated trajectories with confirmed local returning motion.
[env:atoms3cam-foot-support-local]
extends = env:atoms3cam-foot-support-assist
build_flags =
  ${env:atoms3cam-foot-support-assist.build_flags}
  -DFOOT_SUPPORT_LOCAL=1

; v13 first-reversal evidence and bounded foot-amount width addition.
[env:atoms3cam-foot-support-transfer]
extends = env:atoms3cam-foot-support-local
build_flags =
  ${env:atoms3cam-foot-support-local.build_flags}
  -DFOOT_SUPPORT_TRANSFER=1

; v14 selects every post-bootstrap width by energy deficit and response model.
[env:atoms3cam-foot-support-energy]
extends = env:atoms3cam-foot-support-transfer
build_flags =
  ${env:atoms3cam-foot-support-transfer.build_flags}
  -DFOOT_SUPPORT_ENERGY=1

; v15 moves the complete main energy budget earlier; no generic 15ms cap.
[env:atoms3cam-early-energy-main]
extends = env:atoms3cam-foot-support-energy
build_flags =
  ${env:atoms3cam-foot-support-energy.build_flags}
  -DEARLY_ENERGY_MAIN=1

; v16 fixes stale-loop pulse expiry and audits realized command duration.
[env:atoms3cam-energy-pulse-lifecycle]
extends = env:atoms3cam-early-energy-main
build_flags =
  ${env:atoms3cam-early-energy-main.build_flags}
  -DPULSE_LIFECYCLE_FIX=1

; Same v16 motor policy; allow a slow AP to finish the runtime HTML response.
[env:atoms3cam-energy-pulse-lifecycle-webfix]
extends = env:atoms3cam-energy-pulse-lifecycle
build_flags =
  ${env:atoms3cam-energy-pulse-lifecycle.build_flags}
  -DWEB_PAGE_TRANSPORT_FIX=1

; Reserve internal Wi-Fi RAM by moving the passive 192-row archive to PSRAM.
[env:atoms3cam-energy-pulse-lifecycle-webfix2]
extends = env:atoms3cam-energy-pulse-lifecycle-webfix
build_flags =
  ${env:atoms3cam-energy-pulse-lifecycle-webfix.build_flags}
  -DWALKING_AUDIT_PSRAM=1

; v17 adds causal arrival-energy feedback and a foot-gated return-work budget.
[env:atoms3cam-return-energy]
extends = env:atoms3cam-energy-pulse-lifecycle-webfix2
build_flags =
  ${env:atoms3cam-energy-pulse-lifecycle-webfix2.build_flags}
  -DWALKING_RETURN_ENERGY=1

; v18 separates return aid from the ordinary ZERO opportunity within one budget.
[env:atoms3cam-energy-transfer]
extends = env:atoms3cam-return-energy
build_flags =
  ${env:atoms3cam-return-energy.build_flags}
  -DWALKING_TRANSFER_V18=1
