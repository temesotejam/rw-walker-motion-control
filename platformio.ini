; AtomS3R Free-foot v39: 40 Hz foot angles, support-transfer predictions, v19 motor control.
[platformio]
default_envs = atoms3cam-foot-periodic40

[env:atoms3cam-foot-periodic40]
platform = espressif32@6.7.0
board = m5stack-atoms3
framework = arduino

; Flash layout and octal PSRAM for this board.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.boot = qio
board_build.boot_freq = 80m
board_build.flash_freq = 80m
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = time
upload_speed = 115200

lib_deps =
  m5stack/M5Unified @ 0.2.18
  m5stack/M5GFX @ 0.2.30
  adafruit/Adafruit AHRS @ 2.4.0
extra_scripts =
  pre:tools/patch_bmi270_timing.py
  pre:tools/patch_madgwick_hot.py
  pre:tools/check_camera_hal_abi.py

; Replace the Arduino event-task board default with Core 0.
build_unflags = -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
  ; ESP32-S3 runtime and Arduino task placement
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_EVENT_RUNNING_CORE=0
  -Wl,--wrap=xTaskCreatePinnedToCore
  ; Walking phases and foot support
  -DFOOT_EARLY_TRIAL=1
  -DANGLE_EARLY_TRIAL=1
  -DWALK_SMOOTH_TRIAL=1
  -DSYMMETRIC_RESCUE_TRIAL=1
  -DEARLY_RESCUE_TRIAL=1
  -DSWAY_BALANCE_TRIAL=1
  -DFOOT_SUPPORT_ASSIST=1
  -DFOOT_SUPPORT_LOCAL=1
  -DFOOT_SUPPORT_TRANSFER=1
  ; Energy-based pulses, completion timing and telemetry
  -DFOOT_SUPPORT_ENERGY=1
  -DEARLY_ENERGY_MAIN=1
  -DPULSE_LIFECYCLE_FIX=1
  -DWEB_PAGE_TRANSPORT_FIX=1
  -DWALKING_AUDIT_PSRAM=1
  -DWALKING_RETURN_ENERGY=1
  -DWALKING_TRANSFER_V18=1
  -DWALKING_ADMISSION_V19=1
  ; Foot-camera acquisition and measurement-log export
  -DFOOT_LOW_LATENCY_V20=1
  -DEXPORT_RETRY_FIX=1
  -DEXPORT_COOPERATIVE_FIX=1
  -DCAMERA_FRAME_READY_V21=1
  -DFOOT_SPEED_V22=1
  -DFOOT_SPEED_FIX1=1
  -DFOOT_CAPTURE_V23=1
  -DFOOT_ROW_OVERLAP_V24=1
  -DFOOT_NATIVE_SKIP_V25=1
  -DCAMERA_NATIVE_HB=96
  -DFOOT_NATIVE_STREAM_V26=1
  -DFOOT_EXPORT_WEBFIX=1
  ; Camera processing and diagnostics
  -DFOOT_COPY_DELTA_V27=1
  -DFOOT_TEMPLATE_PRUNE_V28=1
  -DFOOT_OVERLAP_ALWAYS_V29=1
  -DFOOT_RECEIVE_DIAG_V30=1
  -DFOOT_HISTOGRAM_V32=1
  -DFOOT_WORKER26_V34=1
  ; Live status and 40 Hz periodic foot-angle publication
  -DFOOT_LIVE_STATUS_V35=1
  -DFOOT_STABLE40_V36=1
  -DFOOT_CADENCE20_V37=1
  -DFOOT_PERIODIC_V38=1
  -DSUPPORT_TRANSFER_V39=1
  -DSUPPORT_TRANSFER_CARRY2=1
  -DSUPPORT_TRANSFER_ARC_FEEDBACK=1
  -DWALKING_TURN_OBSERVER=1
